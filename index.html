<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3d52">
<title>Painel da Lavagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root {
    --bg: #f1f4f6;
    --panel: #ffffff;
    --soft: #e8eef2;
    --ink: #0f2230;
    --mut: #5b6b78;
    --line: #dde3e8;
    --hero: #0a3d52;
    --accent: #0a6c8f;
    --on-accent: #ffffff;
    --font-d: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-b: "Barlow", system-ui, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1419;
      --panel: #121e26;
      --soft: #1a2a34;
      --ink: #e7eff4;
      --mut: #8ea3b1;
      --line: #22323d;
      --hero: #0e4660;
      --accent: #43b3dc;
      --on-accent: #06222e;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 90px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-b);
    font-size: 16px;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  main { max-width: 1120px; margin: 0 auto; padding: 8px 18px 60px; }
  h1, h2, h3 { font-family: var(--font-d); margin: 0; letter-spacing: 0.01em; }
  h2 { font-size: 26px; font-weight: 700; margin: 40px 0 4px; }
  .nota { color: var(--mut); font-size: 14px; margin: 0 0 14px; }

  /* ---------- Barra superior ---------- */
  .topo {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0);
  }
  .topo-in {
    max-width: 1120px; margin: 0 auto; padding: 12px 18px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
  }
  .marca { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .marca svg { width: 38px; height: 38px; flex: none; }
  .marca h1 { font-size: 28px; font-weight: 700; line-height: 1; }
  .marca small { color: var(--mut); font-size: 13px; }
  .controles { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

  .seg { display: flex; background: var(--soft); border-radius: 12px; padding: 4px; gap: 2px; overflow-x: auto; }
  .seg button {
    border: 0; background: transparent; color: var(--mut);
    font: 600 14px var(--font-b); padding: 8px 13px; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }

  .btn-icone {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer; display: grid; place-items: center;
  }
  .btn-icone svg { width: 18px; height: 18px; }
  .btn-icone.gira svg { animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .primario {
    border: 0; background: var(--accent); color: var(--on-accent);
    font: 600 15px var(--font-b); padding: 0 18px; height: 40px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .primario svg { width: 16px; height: 16px; }
  .primario:disabled { opacity: .6; cursor: wait; }
  .menu { position: relative; }
  .pop {
    position: absolute; right: 0; top: calc(100% + 8px); width: 290px; z-index: 30;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px;
    box-shadow: 0 16px 40px rgba(0,0,0,.2);
  }
  .pop[hidden] { display: none; }
  .pop button {
    width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink);
    padding: 10px 12px; border-radius: 10px; cursor: pointer; font: inherit; display: block;
  }
  .pop button:hover { background: var(--soft); }
  .pop b { display: block; font-weight: 600; }
  .pop span { color: var(--mut); font-size: 13px; }

  /* ---------- Destaque ---------- */
  .hero {
    background: var(--hero); color: #fff; border-radius: 22px; padding: 30px 32px;
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px 40px; margin-top: 20px;
  }
  .hero .rotulo { opacity: .8; font-size: 16px; }
  .hero .grande { font: 700 clamp(84px, 14vw, 148px)/.88 var(--font-d); letter-spacing: -.01em; margin: 6px 0 8px; }
  .hero .sub { opacity: .8; }
  .stats { align-self: end; }
  .stats div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.18); }
  .stats div:last-child { border-bottom: 0; }
  .stats span { opacity: .78; }
  .stats b { font: 600 24px var(--font-d); text-align: right; }
  .mixwrap { grid-column: 1 / -1; }
  .mix { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.16); gap: 2px; }
  .mix i { display: block; height: 100%; min-width: 3px; }
  .mix.fino { height: 8px; background: var(--soft); }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 14px; }
  .legenda span { display: inline-flex; align-items: center; gap: 7px; opacity: .92; }
  .legenda b { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  /* ---------- Equipe ---------- */
  .equipe { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
  .ficha {
    position: relative; overflow: hidden; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px 18px 24px;
  }
  .ficha::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--cor); }
  .cab { display: flex; align-items: center; gap: 12px; }
  .cab h3 { font-size: 24px; font-weight: 700; }
  .rank { margin-left: auto; font: 600 15px var(--font-d); color: var(--mut); }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; background: var(--cor); color: #fff; flex: none;
    display: grid; place-items: center; font: 700 22px var(--font-d);
  }
  .ficha .total { font: 700 64px/1 var(--font-d); margin: 14px 0 12px; }
  .ficha .total small { font: 500 16px var(--font-b); color: var(--mut); margin-left: 6px; }
  dl.fatos { margin: 14px 0 0; }
  dl.fatos div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
  dl.fatos dt { color: var(--mut); }
  dl.fatos dd { margin: 0; font-weight: 600; text-align: right; }

  /* ---------- Líderes por tipo ---------- */
  .amostras { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); gap: 12px; }
  .amostra { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .amostra .faixa { background: var(--c); color: #fff; font: 600 17px var(--font-d); padding: 8px 14px; letter-spacing: .02em; }
  .amostra .corpo { padding: 12px 14px 14px; }
  .amostra .quem { display: flex; flex-wrap: wrap; gap: 6px 10px; font-weight: 600; min-height: 24px; align-items: center; }
  .amostra .quem .avatar { width: 22px; height: 22px; font-size: 13px; }
  .amostra .qtd { color: var(--mut); font-size: 14px; margin-top: 4px; }

  /* ---------- Painéis, tabela e listas ---------- */
  .painel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .painel h3 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
  .grande-col { grid-column: 1 / -1; }
  .graf { position: relative; height: 290px; }
  .rolagem { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 680px; }
  th, td { padding: 11px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { font-size: 13px; color: var(--mut); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  tr.geral td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; background: var(--soft); }
  .ponto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: var(--cor); }

  .rk { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; overflow: hidden; background: var(--soft); margin-bottom: 6px; }
  .rk .fill { position: absolute; inset: 0 auto 0 0; background: var(--cor, var(--accent)); opacity: .2; }
  .rk > * { position: relative; }
  .rk .pos { font: 700 20px var(--font-d); width: 26px; color: var(--mut); }
  .rk .data { font-weight: 600; }
  .rk .espaco { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .rk .n { font: 700 20px var(--font-d); min-width: 28px; text-align: right; }
  .tres { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .tres h3 { display: flex; align-items: center; gap: 8px; }

  .chip { display: inline-block; padding: 2px 10px; border-radius: 99px; color: #fff; font-size: 13px; font-weight: 600; background: var(--cor); }
  .ida-linha { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .ida-linha:last-child { border-bottom: 0; }
  .ida-linha .data { font-weight: 600; min-width: 130px; }
  .ida-linha .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .ida-linha .n { margin-left: auto; font: 700 20px var(--font-d); }

  .msg { background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; padding: 18px; color: var(--mut); margin-top: 20px; }
  .err { border-color: #b3382c; color: #b3382c; }
  .link { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; }
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 99px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 90vw; text-align: center;
  }
  #toast.on { opacity: 1; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; padding: 24px 20px; }
    .marca h1 { font-size: 24px; }
    .controles { width: 100%; }
    .seg { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .btn-icone.gira svg { animation: none; } }
</style>
</head>
<body>

<div class="topo">
  <div class="topo-in">
    <div class="marca">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#0a3d52"/>
        <path d="M20 7 L28.5 19.5 A9.5 9.5 0 1 1 11.5 19.5 Z" fill="#fff"/>
        <ellipse cx="16.8" cy="23.5" rx="1.8" ry="3.6" fill="#a9d6e8"/>
      </svg>
      <div>
        <h1>Painel da Lavagem</h1>
        <small id="atualizado">Carregando…</small>
      </div>
    </div>
    <div class="controles">
      <div class="seg" id="barra">
        <button data-p="hoje">Hoje</button>
        <button data-p="sete">7 dias</button>
        <button data-p="trinta">30 dias</button>
        <button data-p="mes">Este mês</button>
        <button data-p="tudo">Tudo</button>
      </div>
      <button class="btn-icone" id="atualizar" title="Atualizar dados" aria-label="Atualizar dados">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <div class="menu">
        <button class="primario" id="exportar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
          Exportar
        </button>
        <div class="pop" id="menuExp" hidden>
          <button data-x="simples"><b>Planilha</b><span>Modelo da folha de lavagem, uma aba por dia, com horário</span></button>
          <button data-x="graficos"><b>Planilha com gráficos</b><span>Resumo, tabelas, registros e os 4 gráficos como imagem</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<main id="conteudo"></main>
<div id="toast"></div>

<script>
  // ---------- Configuração ----------
  const DB = "https://controle-de-lavagens-78b2e-default-rtdb.firebaseio.com";
  const EQUIPE = { Felipe: "#0f766e", Marcos: "#be185d", Jonathan: "#4338ca" };
  const TIPOS = { novo: "Carro novo", of: "Oficina", teste: "Test drive", show: "Showroom" };
  const COR_TIPO = { novo: "#1b7f4b", of: "#b3382c", teste: "#b86e00", show: "#1f5fbf" };
  const PERIODOS = { hoje: "Hoje", sete: "Últimos 7 dias", trinta: "Últimos 30 dias", mes: "Este mês", tudo: "Todo o histórico" };
  const nomes = Object.keys(EQUIPE);
  const chavesTipos = Object.keys(TIPOS);
  const TEMA_CLARO = { texto: "#33424e", grade: "#dde3e8", ink: "#0f2230" };
  const HORA_VIRADA = 20; // após 20:00, o "hoje" já é o dia seguinte

  // ---------- Estado ----------
  let periodo = "trinta";
  let bruto = null;
  let erro = "";
  let carregando = true;
  let atualizadoEm = null;
  let graficos = [];
  let exportando = false;

  // ---------- Utilidades ----------
  const $ = (seletor) => document.querySelector(seletor);

  function iso(d) {
    const mes = String(d.getMonth() + 1).padStart(2, "0");
    const dia = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + mes + "-" + dia;
  }
  // Data de hoje considerando a virada às 20:00
  function hojeOperacional() {
    const d = new Date();
    if (d.getHours() >= HORA_VIRADA) d.setDate(d.getDate() + 1);
    return iso(d);
  }
  function brData(dia) { return dia.split("-").reverse().join("/"); }
  function fmtData(dia) {
    const [a, m, d] = dia.split("-").map(Number);
    return new Date(a, m - 1, d).toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", year: "2-digit" });
  }
  function fmtDiaCurto(dia) { const p = dia.split("-"); return p[2] + "/" + p[1]; }
  function hora(ts) { return new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  function media(total, dias) { return dias ? (total / dias).toFixed(1).replace(".", ",") : "—"; }
  function mediaNum(total, dias) { return dias ? Math.round((total / dias) * 10) / 10 : null; }

  function ordenarDias(mapa) {
    return Object.entries(mapa).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? 1 : -1));
  }
  function melhorDia(mapa) {
    const primeiro = ordenarDias(mapa)[0];
    return primeiro ? fmtData(primeiro[0]) + " (" + primeiro[1] + ")" : "—";
  }
  function toast(mensagem) {
    const t = $("#toast");
    t.textContent = mensagem;
    t.classList.add("on");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("on"), 2600);
  }

  // ---------- Pequenos blocos de interface ----------
  function avatar(nome) {
    return `<span class="avatar" style="--cor:${EQUIPE[nome]}">${nome.charAt(0)}</span>`;
  }
  function chip(nome, texto) {
    return `<span class="chip" style="--cor:${EQUIPE[nome]}">${texto}</span>`;
  }
  function barraMix(tipos, fino) {
    const total = chavesTipos.reduce((s, k) => s + tipos[k], 0);
    const partes = total
      ? chavesTipos.filter((k) => tipos[k]).map((k) =>
          `<i style="width:${(tipos[k] / total) * 100}%;background:${COR_TIPO[k]}" title="${TIPOS[k]}: ${tipos[k]}"></i>`).join("")
      : "";
    return `<div class="mix${fino ? " fino" : ""}">${partes}</div>`;
  }
  function legendaMix(tipos) {
    return `<div class="legenda">${chavesTipos.map((k) =>
      `<span><b style="background:${COR_TIPO[k]}"></b>${TIPOS[k]} <strong>${tipos[k]}</strong></span>`).join("")}</div>`;
  }
  function animarNumero(el) {
    const alvo = Number(el.dataset.valor);
    const quieto = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!alvo || !window.requestAnimationFrame || quieto) return;
    const inicio = performance.now();
    const duracao = 700;
    function passo(agora) {
      const p = Math.min(1, (agora - inicio) / duracao);
      el.textContent = Math.round(alvo * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(passo);
    }
    requestAnimationFrame(passo);
  }

  // ---------- Banco de dados ----------
  async function buscar(caminho) {
    let resposta;
    try {
      resposta = await fetch(DB + "/" + caminho + ".json");
    } catch (e) {
      throw new Error("Sem conexão com o banco de dados. Verifique a internet.");
    }
    if (resposta.status === 401 || resposta.status === 403) {
      throw new Error("O banco recusou a leitura. Confira as regras do Firebase (lavagens e showroom com .read: true).");
    }
    if (!resposta.ok) throw new Error("Erro do banco de dados (" + resposta.status + ").");
    return (await resposta.json()) || {};
  }

  async function carregar() {
    carregando = true;
    erro = "";
    $("#atualizar").classList.add("gira");
    render();
    try {
      const [lavagens, showroom] = await Promise.all([buscar("lavagens"), buscar("showroom")]);
      bruto = { lavagens: lavagens, showroom: showroom };
      atualizadoEm = new Date();
    } catch (e) {
      erro = e.message;
    }
    carregando = false;
    $("#atualizar").classList.remove("gira");
    render();
  }

  // ---------- Cálculos ----------
  function inicioDoPeriodo() {
    const d = new Date();
    if (d.getHours() >= HORA_VIRADA) d.setDate(d.getDate() + 1);
    if (periodo === "hoje") return iso(d);
    if (periodo === "sete") { d.setDate(d.getDate() - 6); return iso(d); }
    if (periodo === "trinta") { d.setDate(d.getDate() - 29); return iso(d); }
    if (periodo === "mes") { d.setDate(1); return iso(d); }
    return "0000-00-00";
  }

  function intervaloTexto() {
    const inicio = inicioDoPeriodo();
    const fim = brData(hojeOperacional());
    return inicio === "0000-00-00" ? "até " + fim : brData(inicio) + " a " + fim;
  }

  function analisar() {
    const inicio = inicioDoPeriodo();
    const pessoas = {};
    nomes.forEach((n) => {
      pessoas[n] = { total: 0, tipos: { novo: 0, of: 0, teste: 0, show: 0 }, dias: {}, idas: 0 };
    });

    const diasGeral = {};
    let totalCarros = 0;
    for (const [dia, registros] of Object.entries(bruto.lavagens)) {
      if (dia < inicio) continue;
      for (const r of Object.values(registros || {})) {
        const p = pessoas[r.nome];
        if (!p) continue;
        p.total++;
        if (p.tipos[r.tipo] !== undefined) p.tipos[r.tipo]++;
        p.dias[dia] = (p.dias[dia] || 0) + 1;
        const g = diasGeral[dia] || (diasGeral[dia] = { total: 0, porPessoa: {} });
        g.total++;
        g.porPessoa[r.nome] = (g.porPessoa[r.nome] || 0) + 1;
        totalCarros++;
      }
    }

    const idasPorDia = {};
    let totalIdas = 0;
    for (const [dia, registros] of Object.entries(bruto.showroom)) {
      if (dia < inicio) continue;
      for (const r of Object.values(registros || {})) {
        const p = pessoas[r.nome];
        if (!p) continue;
        p.idas++;
        totalIdas++;
        const d = idasPorDia[dia] || (idasPorDia[dia] = {});
        (d[r.nome] = d[r.nome] || []).push(r.ts);
      }
    }
    return { pessoas, diasGeral, idasPorDia, totalCarros, totalIdas };
  }

  // ---------- Gráficos ----------
  const fundoBranco = {
    id: "fundoBranco",
    beforeDraw(chart) {
      const c = chart.ctx;
      c.save();
      c.globalCompositeOperation = "destination-over";
      c.fillStyle = "#ffffff";
      c.fillRect(0, 0, chart.width, chart.height);
      c.restore();
    }
  };

  function temaAtual() {
    const css = getComputedStyle(document.documentElement);
    const v = (nome) => css.getPropertyValue(nome).trim();
    return { texto: v("--mut") || TEMA_CLARO.texto, grade: v("--line") || TEMA_CLARO.grade, ink: v("--ink") || TEMA_CLARO.ink };
  }

  function montarConfigs(A, tema, paraImagem) {
    const base = {
      responsive: !paraImagem,
      maintainAspectRatio: false,
      animation: paraImagem ? false : { duration: 500 },
      color: tema.texto,
      borderColor: tema.grade,
      font: { family: "Barlow, system-ui, sans-serif", size: paraImagem ? 18 : 13 },
      plugins: { legend: { labels: { usePointStyle: true, boxWidth: 8, color: tema.texto } } }
    };
    if (paraImagem) base.devicePixelRatio = 1;

    const eixoY = { beginAtZero: true, ticks: { precision: 0 } };
    const semGrade = { grid: { display: false } };

    const tipos = {
      type: "bar",
      data: {
        labels: nomes,
        datasets: chavesTipos.map((k) => ({
          label: TIPOS[k],
          data: nomes.map((n) => A.pessoas[n].tipos[k]),
          backgroundColor: COR_TIPO[k],
          borderRadius: 3,
          borderSkipped: false
        }))
      },
      options: { ...base, scales: { x: { stacked: true, ...semGrade }, y: { ...eixoY, stacked: true } } }
    };

    const mix = {
      type: "doughnut",
      data: {
        labels: chavesTipos.map((k) => TIPOS[k]),
        datasets: [{
          data: chavesTipos.map((k) => nomes.reduce((s, n) => s + A.pessoas[n].tipos[k], 0)),
          backgroundColor: chavesTipos.map((k) => COR_TIPO[k]),
          borderWidth: 0
        }]
      },
      options: {
        ...base,
        cutout: "62%",
        plugins: { legend: { position: "bottom", labels: { usePointStyle: true, boxWidth: 8, color: tema.texto } } }
      }
    };

    const dias = Object.keys(A.diasGeral).sort();
    const dias_ = {
      type: "line",
      data: {
        labels: dias.map(fmtDiaCurto),
        datasets: nomes.map((n) => ({
          label: n,
          data: dias.map((d) => A.diasGeral[d].porPessoa[n] || 0),
          borderColor: EQUIPE[n],
          backgroundColor: EQUIPE[n],
          borderWidth: 2.5,
          pointRadius: 3,
          tension: 0.3
        })).concat([{
          label: "Total",
          data: dias.map((d) => A.diasGeral[d].total),
          borderColor: tema.ink,
          backgroundColor: tema.ink,
          borderWidth: 2,
          borderDash: [6, 4],
          pointRadius: 0,
          tension: 0.3
        }])
      },
      options: { ...base, scales: { x: semGrade, y: eixoY } }
    };

    const idas = {
      type: "bar",
      data: {
        labels: nomes,
        datasets: [{
          label: "Idas ao showroom",
          data: nomes.map((n) => A.pessoas[n].idas),
          backgroundColor: nomes.map((n) => EQUIPE[n]),
          borderRadius: 8,
          borderSkipped: false
        }]
      },
      options: { ...base, plugins: { legend: { display: false } }, scales: { x: semGrade, y: eixoY } }
    };

    const configs = { tipos, mix, dias: dias_, idas };
    if (paraImagem) Object.values(configs).forEach((c) => { c.plugins = [fundoBranco]; });
    return configs;
  }

  function destruirGraficos() {
    graficos.forEach((g) => g.destroy());
    graficos = [];
  }

  function criarGraficos(A) {
    if (typeof Chart === "undefined") return;
    const configs = montarConfigs(A, temaAtual(), false);
    [["gTipos", "tipos"], ["gMix", "mix"], ["gDias", "dias"], ["gIdas", "idas"]].forEach(([id, chave]) => {
      graficos.push(new Chart($("#" + id), configs[chave]));
    });
  }

  function imagensDosGraficos(A) {
    const configs = montarConfigs(A, TEMA_CLARO, true);
    const lista = [
      ["tipos", "Carros por colaborador e tipo"],
      ["mix", "Mistura por tipo (geral)"],
      ["dias", "Carros por dia"],
      ["idas", "Idas ao showroom por colaborador"]
    ];
    return lista.map(([chave, titulo]) => {
      const canvas = document.createElement("canvas");
      canvas.width = 1400;
      canvas.height = 640;
      const grafico = new Chart(canvas, configs[chave]);
      const dados = grafico.toBase64Image("image/png", 1);
      grafico.destroy();
      return { titulo, dados };
    });
  }

  // ---------- Planilha (.xlsx) ----------
  function listarRegistros(origem) {
    const inicio = inicioDoPeriodo();
    const saida = [];
    for (const [dia, registros] of Object.entries(origem)) {
      if (dia < inicio) continue;
      for (const r of Object.values(registros || {})) {
        if (EQUIPE[r.nome] === undefined) continue;
        saida.push({ dia, ...r });
      }
    }
    return saida.sort((a, b) => a.ts - b.ts);
  }

  async function gerarXlsx(comGraficos) {
    const A = analisar();
    const wb = new ExcelJS.Workbook();
    wb.creator = "Painel da Lavagem";
    wb.created = new Date();

    const PETROLEO = "FF0A3D52";
    const borda = { style: "thin", color: { argb: "FFD0D7DD" } };
    const bordas = { top: borda, left: borda, bottom: borda, right: borda };
    const dataExcel = (dia) => {
      const [a, m, d] = dia.split("-").map(Number);
      return new Date(Date.UTC(a, m - 1, d));
    };
    function cabecalho(linha) {
      linha.height = 24;
      linha.eachCell((c) => {
        c.font = { bold: true, color: { argb: "FFFFFFFF" } };
        c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: PETROLEO } };
        c.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
        c.border = bordas;
      });
    }
    function corpo(linha, negrito) {
      linha.eachCell((c) => {
        c.border = bordas;
        if (negrito) c.font = { bold: true };
      });
    }

    const mapaGeral = {};
    Object.keys(A.diasGeral).forEach((d) => { mapaGeral[d] = A.diasGeral[d].total; });
    const diasComLavagem = Object.keys(mapaGeral).length;
    const tiposGeral = {};
    chavesTipos.forEach((k) => { tiposGeral[k] = nomes.reduce((s, n) => s + A.pessoas[n].tipos[k], 0); });

    // --- Aba Resumo ---
    const r = wb.addWorksheet("Resumo", { views: [{ showGridLines: false }] });
    r.columns = [28, 14, 14, 14, 14, 12, 10, 12, 22, 16].map((width) => ({ width }));
    r.mergeCells("A1:J1");
    r.getCell("A1").value = "Painel da Lavagem";
    r.getCell("A1").font = { bold: true, size: 20, color: { argb: PETROLEO } };
    r.getCell("A2").value = "Período: " + PERIODOS[periodo] + " (" + intervaloTexto() + ")";
    r.getCell("A3").value = "Gerado em " + new Date().toLocaleString("pt-BR");
    r.getCell("A3").font = { color: { argb: "FF5B6B78" } };

    r.addRow([]);
    cabecalho(r.addRow(["Indicador", "Valor"]));
    [
      ["Total de carros", A.totalCarros],
      ["Dias com lavagem", diasComLavagem],
      ["Média geral por dia", mediaNum(A.totalCarros, diasComLavagem)],
      ["Melhor dia (geral)", melhorDia(mapaGeral)],
      ["Idas ao showroom", A.totalIdas]
    ].forEach((linha) => {
      const l = r.addRow(linha);
      corpo(l);
      l.getCell(2).alignment = { horizontal: "right" };
      if (linha[0] === "Média geral por dia") l.getCell(2).numFmt = "0.0";
    });

    r.addRow([]);
    const cab = r.addRow(["Colaborador", ...chavesTipos.map((k) => TIPOS[k]), "Total", "Dias", "Média/dia", "Melhor dia", "Idas showroom"]);
    cabecalho(cab);
    nomes.forEach((n) => {
      const p = A.pessoas[n];
      const nDias = Object.keys(p.dias).length;
      const l = r.addRow([n, ...chavesTipos.map((k) => p.tipos[k]), p.total, nDias, mediaNum(p.total, nDias), melhorDia(p.dias), p.idas]);
      corpo(l);
      l.getCell(8).numFmt = "0.0";
    });
    const geral = r.addRow(["Geral", ...chavesTipos.map((k) => tiposGeral[k]), A.totalCarros, diasComLavagem,
      mediaNum(A.totalCarros, diasComLavagem), melhorDia(mapaGeral), A.totalIdas]);
    corpo(geral, true);
    geral.getCell(8).numFmt = "0.0";
    geral.eachCell((c) => { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE8EEF2" } }; });

    // --- Aba Gráficos (opcional) ---
    if (comGraficos) {
      const g = wb.addWorksheet("Gráficos", { views: [{ showGridLines: false }] });
      let topo = 1;
      imagensDosGraficos(A).forEach((img) => {
        g.getCell(topo, 1).value = img.titulo;
        g.getCell(topo, 1).font = { bold: true, size: 14, color: { argb: PETROLEO } };
        const id = wb.addImage({ base64: img.dados, extension: "png" });
        g.addImage(id, { tl: { col: 0, row: topo }, ext: { width: 800, height: 366 } });
        topo += 21;
      });
    }

    // --- Aba Por dia ---
    const porDia = wb.addWorksheet("Por dia", { views: [{ state: "frozen", ySplit: 1 }] });
    porDia.columns = [14, 12, 12, 12, 10, 16].map((width) => ({ width }));
    cabecalho(porDia.addRow(["Data", ...nomes, "Total", "Idas showroom"]));
    const todosDias = Array.from(new Set(Object.keys(A.diasGeral).concat(Object.keys(A.idasPorDia)))).sort();
    todosDias.forEach((dia) => {
      const g = A.diasGeral[dia] || { total: 0, porPessoa: {} };
      const idasDia = A.idasPorDia[dia]
        ? nomes.reduce((s, n) => s + (A.idasPorDia[dia][n] ? A.idasPorDia[dia][n].length : 0), 0)
        : 0;
      const l = porDia.addRow([dataExcel(dia), ...nomes.map((n) => g.porPessoa[n] || 0), g.total, idasDia]);
      corpo(l);
      l.getCell(1).numFmt = "dd/mm/yyyy";
    });

    // --- Aba Registros ---
    const reg = wb.addWorksheet("Registros", { views: [{ state: "frozen", ySplit: 1 }] });
    reg.columns = [14, 10, 16, 16, 24, 16].map((width) => ({ width }));
    cabecalho(reg.addRow(["Data", "Hora", "Colaborador", "Tipo", "Carro", "Placa/Chassi (4 últimos)"]));
    listarRegistros(bruto.lavagens).forEach((x) => {
      const l = reg.addRow([dataExcel(x.dia), hora(x.ts), x.nome, TIPOS[x.tipo] || x.tipo, x.carro || "", String(x.placa || "")]);
      corpo(l);
      l.getCell(1).numFmt = "dd/mm/yyyy";
      l.getCell(6).numFmt = "@";
    });
    reg.autoFilter = { from: "A1", to: "F1" };

    // --- Aba Showroom ---
    const sh = wb.addWorksheet("Showroom", { views: [{ state: "frozen", ySplit: 1 }] });
    sh.columns = [14, 10, 16].map((width) => ({ width }));
    cabecalho(sh.addRow(["Data", "Hora", "Colaborador"]));
    listarRegistros(bruto.showroom).forEach((x) => {
      const l = sh.addRow([dataExcel(x.dia), hora(x.ts), x.nome]);
      corpo(l);
      l.getCell(1).numFmt = "dd/mm/yyyy";
    });
    sh.autoFilter = { from: "A1", to: "C1" };

    return wb.xlsx.writeBuffer();
  }

  // Planilha no modelo da folha de lavagem impressa, agora com VEICULO preenchido
  async function gerarPlanilhaDiaria() {
    const wb = new ExcelJS.Workbook();
    wb.creator = "Painel da Lavagem";
    wb.created = new Date();

    const preto = { style: "thin", color: { argb: "FF000000" } };
    const bordas = { top: preto, left: preto, bottom: preto, right: preto };
    const LINHAS_MINIMAS = 15;

    const porDia = {};
    listarRegistros(bruto.lavagens).forEach((x) => {
      (porDia[x.dia] = porDia[x.dia] || []).push(x);
    });
    let dias = Object.keys(porDia).sort();
    if (!dias.length) dias = [hojeOperacional()];

    dias.forEach((dia) => {
      const registros = porDia[dia] || [];
      const total = Math.max(LINHAS_MINIMAS, registros.length);
      const ws = wb.addWorksheet(dia.split("-").reverse().join("-"), {
        pageSetup: {
          paperSize: 9,
          orientation: "portrait",
          fitToPage: true,
          fitToWidth: 1,
          fitToHeight: 0,
          horizontalCentered: true,
          margins: { left: 0.5, right: 0.5, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3 }
        }
      });
      ws.columns = [6, 26, 22, 20, 22, 12].map((width) => ({ width }));

      // Linha 1: título (A:D) e data (E:F)
      ws.mergeCells("A1:D1");
      ws.mergeCells("E1:F1");
      ws.getCell("A1").value = "PLANILHA DE LAVAGEM";
      ws.getCell("E1").value = "DATA: " + dia.split("-").reverse().join(" / ");
      const l1 = ws.getRow(1);
      l1.height = 30;
      for (let c = 1; c <= 6; c++) {
        const cel = l1.getCell(c);
        cel.border = bordas;
        cel.alignment = { horizontal: "center", vertical: "middle" };
      }
      ws.getCell("A1").font = { bold: true, size: 15 };
      ws.getCell("E1").font = { bold: true, size: 12 };

      // Linha 2: cabeçalho das colunas
      const l2 = ws.getRow(2);
      l2.height = 24;
      ["", "VEICULO", "CHASSI", "SETOR", "LAVADOR", "HORÁRIO"].forEach((texto, i) => {
        const cel = l2.getCell(i + 1);
        cel.value = texto;
        cel.font = { bold: true, size: 12 };
        cel.border = bordas;
        cel.alignment = { horizontal: "center", vertical: "middle" };
      });

      // Linhas numeradas
      for (let i = 0; i < total; i++) {
        const x = registros[i];
        const linha = ws.getRow(3 + i);
        linha.height = 22;
        const valores = [
          i + 1,
          x ? (x.carro || "") : "",
          x ? String(x.placa || "") : "",
          x ? (TIPOS[x.tipo] || x.tipo) : "",
          x ? x.nome : "",
          x ? hora(x.ts) : ""
        ];
        valores.forEach((v, c) => {
          const cel = linha.getCell(c + 1);
          cel.value = v;
          cel.font = { size: 12 };
          cel.border = bordas;
          cel.alignment = { horizontal: "center", vertical: "middle" };
          if (c === 2) cel.numFmt = "@";
        });
      }
      ws.pageSetup.printArea = "A1:F" + (2 + total);
    });

    return wb.xlsx.writeBuffer();
  }

  function baixarArquivo(buffer, nome) {
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = nome;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 4000);
  }

  async function exportar(tipo) {
    if (exportando) return;
    if (!bruto) { toast("Aguarde os dados carregarem."); return; }
    const comGraficos = tipo === "graficos";
    if (typeof ExcelJS === "undefined" || (comGraficos && typeof Chart === "undefined")) {
      toast("A biblioteca da planilha não carregou. Verifique a internet e recarregue.");
      return;
    }
    exportando = true;
    $("#exportar").disabled = true;
    toast("Gerando planilha…");
    try {
      const buffer = comGraficos ? await gerarXlsx(true) : await gerarPlanilhaDiaria();
      const nome = (comGraficos ? "painel-lavagem-" : "planilha-lavagem-") + periodo + "-" + hojeOperacional() + (comGraficos ? "-graficos" : "") + ".xlsx";
      baixarArquivo(buffer, nome);
      toast("Planilha pronta: " + nome);
    } catch (e) {
      console.error(e);
      toast("Não foi possível gerar a planilha.");
    }
    exportando = false;
    $("#exportar").disabled = false;
  }

  // ---------- Tela ----------
  function render() {
    destruirGraficos();
    document.querySelectorAll("#barra [data-p]").forEach((b) => b.classList.toggle("on", b.dataset.p === periodo));
    $("#atualizado").textContent = atualizadoEm
      ? "Atualizado às " + atualizadoEm.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
      : (carregando ? "Carregando…" : "Sem dados");

    const alvo = $("#conteudo");

    if (!bruto) {
      if (carregando) {
        alvo.innerHTML = `<div class="msg">Carregando dados…</div>`;
      } else {
        alvo.innerHTML = `<div class="msg err">${erro} <button class="link" id="tentar">Tentar de novo</button></div>`;
        $("#tentar").onclick = carregar;
      }
      return;
    }

    const A = analisar();
    const aviso = erro ? `<div class="msg err">${erro} Mostrando os últimos dados carregados.</div>` : "";

    if (A.totalCarros === 0 && A.totalIdas === 0) {
      alvo.innerHTML = aviso + `<div class="msg">Nenhum registro em "${PERIODOS[periodo].toLowerCase()}".</div>`;
      return;
    }

    const mapaGeral = {};
    Object.keys(A.diasGeral).forEach((d) => { mapaGeral[d] = A.diasGeral[d].total; });
    const diasComLavagem = Object.keys(mapaGeral).length;
    const tiposGeral = {};
    chavesTipos.forEach((k) => { tiposGeral[k] = nomes.reduce((s, n) => s + A.pessoas[n].tipos[k], 0); });

    // --- Destaque ---
    const hero = `
      <section class="hero">
        <div>
          <div class="rotulo">Carros lavados · ${PERIODOS[periodo].toLowerCase()}</div>
          <div class="grande" id="numHero" data-valor="${A.totalCarros}">${A.totalCarros}</div>
          <div class="sub">em ${diasComLavagem} ${diasComLavagem === 1 ? "dia" : "dias"} com lavagem</div>
        </div>
        <div class="stats">
          <div><span>Média por dia</span><b>${media(A.totalCarros, diasComLavagem)}</b></div>
          <div><span>Melhor dia</span><b>${melhorDia(mapaGeral)}</b></div>
          <div><span>Idas ao showroom</span><b>${A.totalIdas}</b></div>
        </div>
        <div class="mixwrap">${barraMix(tiposGeral, false)}${legendaMix(tiposGeral)}</div>
      </section>`;

    // --- Fichas da equipe ---
    const ordem = nomes.slice().sort((a, b) => A.pessoas[b].total - A.pessoas[a].total);
    const fichas = ordem.map((n) => {
      const p = A.pessoas[n];
      const nDias = Object.keys(p.dias).length;
      const posicao = 1 + nomes.filter((x) => A.pessoas[x].total > p.total).length;
      return `
        <article class="ficha" style="--cor:${EQUIPE[n]}">
          <div class="cab">${avatar(n)}<h3>${n}</h3>${p.total ? `<span class="rank">${posicao}º lugar</span>` : ""}</div>
          <div class="total">${p.total}<small>carros</small></div>
          ${barraMix(p.tipos, true)}
          <dl class="fatos">
            <div><dt>Média por dia</dt><dd>${media(p.total, nDias)}</dd></div>
            <div><dt>Dias trabalhados</dt><dd>${nDias}</dd></div>
            <div><dt>Melhor dia</dt><dd>${melhorDia(p.dias)}</dd></div>
            <div><dt>Idas ao showroom</dt><dd>${p.idas}</dd></div>
          </dl>
        </article>`;
    }).join("");

    // --- Quem mais lavou de cada tipo ---
    const lideres = chavesTipos.map((k) => {
      const valores = nomes.map((n) => A.pessoas[n].tipos[k]);
      const maximo = Math.max(...valores);
      const donos = maximo > 0 ? nomes.filter((n, i) => valores[i] === maximo) : [];
      return `
        <div class="amostra" style="--c:${COR_TIPO[k]}">
          <div class="faixa">${TIPOS[k]}</div>
          <div class="corpo">
            <div class="quem">${donos.length ? donos.map((n) => avatar(n) + n).join(" ") : "—"}</div>
            <div class="qtd">${maximo > 0 ? maximo + " de " + tiposGeral[k] + " no total" : "nenhum registro"}</div>
          </div>
        </div>`;
    }).join("");

    // --- Tabela comparativa ---
    const linhas = nomes.map((n) => {
      const p = A.pessoas[n];
      const nDias = Object.keys(p.dias).length;
      return `<tr>
        <td><span class="ponto" style="--cor:${EQUIPE[n]}"></span><b>${n}</b></td>
        ${chavesTipos.map((k) => `<td>${p.tipos[k]}</td>`).join("")}
        <td><b>${p.total}</b></td><td>${nDias}</td><td>${media(p.total, nDias)}</td><td>${melhorDia(p.dias)}</td><td>${p.idas}</td>
      </tr>`;
    }).join("");
    const linhaGeral = `<tr class="geral">
      <td>Geral</td>
      ${chavesTipos.map((k) => `<td>${tiposGeral[k]}</td>`).join("")}
      <td>${A.totalCarros}</td><td>${diasComLavagem}</td><td>${media(A.totalCarros, diasComLavagem)}</td><td>${melhorDia(mapaGeral)}</td><td>${A.totalIdas}</td>
    </tr>`;

    // --- Melhores dias ---
    const maxGeral = Math.max(...Object.values(mapaGeral), 1);
    const topGeral = ordenarDias(mapaGeral).slice(0, 5).map(([dia, n], i) => `
      <div class="rk" style="--cor:var(--accent)">
        <div class="fill" style="width:${(n / maxGeral) * 100}%"></div>
        <span class="pos">${i + 1}</span>
        <span class="data">${fmtData(dia)}</span>
        <span class="espaco">${nomes.filter((x) => A.diasGeral[dia].porPessoa[x]).map((x) => chip(x, x + " " + A.diasGeral[dia].porPessoa[x])).join("")}</span>
        <span class="n">${n}</span>
      </div>`).join("");

    const topPessoas = nomes.map((n) => {
      const top = ordenarDias(A.pessoas[n].dias).slice(0, 3);
      const maximo = top.length ? top[0][1] : 1;
      return `
        <div class="painel">
          <h3>${avatar(n)} ${n}</h3>
          ${top.length ? top.map(([dia, c], i) => `
            <div class="rk" style="--cor:${EQUIPE[n]}">
              <div class="fill" style="width:${(c / maximo) * 100}%"></div>
              <span class="pos">${i + 1}</span><span class="data">${fmtData(dia)}</span><span class="n" style="margin-left:auto">${c}</span>
            </div>`).join("") : `<div class="nota">Sem registros</div>`}
        </div>`;
    }).join("");

    // --- Idas ao showroom ---
    const diasIda = Object.keys(A.idasPorDia).sort().reverse();
    const listaIda = diasIda.length
      ? diasIda.map((dia) => {
          const doDia = A.idasPorDia[dia];
          const totalDia = nomes.reduce((s, n) => s + (doDia[n] ? doDia[n].length : 0), 0);
          const quem = nomes.filter((n) => doDia[n]).map((n) =>
            chip(n, n + " · " + doDia[n].slice().sort((a, b) => a - b).map(hora).join(", "))).join("");
          return `<div class="ida-linha"><span class="data">${fmtData(dia)}</span><span class="chips">${quem}</span><span class="n">${totalDia}</span></div>`;
        }).join("")
      : `<div class="nota">Nenhuma ida ao showroom neste período.</div>`;

    alvo.innerHTML = aviso + hero + `
      <h2>Equipe</h2>
      <p class="nota">Ranking por total de carros no período.</p>
      <div class="equipe">${fichas}</div>

      <h2>Quem mais lavou de cada tipo</h2>
      <p class="nota">O líder de cada categoria e quanto ele fez do total.</p>
      <div class="amostras">${lideres}</div>

      <h2>Comparativo</h2>
      <p class="nota">Média por dia = carros divididos pelos dias em que a pessoa lavou pelo menos um carro. Na linha Geral, são os dias em que alguém lavou.</p>
      <div class="painel rolagem">
        <table>
          <thead><tr><th>Colaborador</th>${chavesTipos.map((k) => `<th>${TIPOS[k]}</th>`).join("")}<th>Total</th><th>Dias</th><th>Média/dia</th><th>Melhor dia</th><th>Idas showroom</th></tr></thead>
          <tbody>${linhas}${linhaGeral}</tbody>
        </table>
      </div>

      <h2>Gráficos</h2>
      <p class="nota" style="margin-bottom:14px">Os mesmos gráficos podem ir para a planilha pelo botão Exportar.</p>
      <div class="grid2">
        <div class="painel"><h3>Carros por colaborador e tipo</h3><div class="graf"><canvas id="gTipos"></canvas></div></div>
        <div class="painel"><h3>Mistura por tipo</h3><div class="graf"><canvas id="gMix"></canvas></div></div>
        <div class="painel grande-col"><h3>Carros por dia</h3><div class="graf"><canvas id="gDias"></canvas></div></div>
        <div class="painel"><h3>Idas ao showroom por colaborador</h3><div class="graf"><canvas id="gIdas"></canvas></div></div>
      </div>

      <h2>Melhores dias</h2>
      <p class="nota">Os 5 dias com mais carros lavados, somando toda a equipe.</p>
      <div class="painel">${topGeral || `<div class="nota">Sem registros</div>`}</div>
      <p class="nota" style="margin-top:18px">Os 3 melhores dias de cada colaborador.</p>
      <div class="tres">${topPessoas}</div>

      <h2>Idas ao showroom</h2>
      <p class="nota">Quem foi, em que dia e a que horas.</p>
      <div class="painel">${listaIda}</div>
    `;

    criarGraficos(A);
    animarNumero($("#numHero"));
  }

  // ---------- Eventos ----------
  document.querySelectorAll("#barra [data-p]").forEach((b) => {
    b.onclick = () => { periodo = b.dataset.p; render(); };
  });
  $("#atualizar").onclick = carregar;

  const menuExp = $("#menuExp");
  $("#exportar").onclick = (e) => { e.stopPropagation(); menuExp.hidden = !menuExp.hidden; };
  menuExp.onclick = (e) => e.stopPropagation();
  document.addEventListener("click", () => { menuExp.hidden = true; });
  menuExp.querySelectorAll("[data-x]").forEach((b) => {
    b.onclick = () => { menuExp.hidden = true; exportar(b.dataset.x); };
  });

  carregar();

  // Recarrega o painel quando virar a hora (20:00)
  let diaAtualVisivel = hojeOperacional();
  setInterval(() => {
    const novoDia = hojeOperacional();
    if (novoDia !== diaAtualVisivel) {
      diaAtualVisivel = novoDia;
      carregar();
    }
  }, 60000);
</script>
</body>
</html>
